[package]
name = "lucky_launcher"
version = "0.1.0"
edition = "2021"
description = "幸运启动器：轻量桌面快速启动工具（基于 windui）"

[lib]
name = "lucky_launcher"
path = "src/lib.rs"

[[bin]]
name = "lucky_launcher"
path = "src/main.rs"

[dependencies]
windui = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pinyin = "0.10"
uuid = { version = "1", features = ["v4"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
] }

[build-dependencies]
embed-resource = "3.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
